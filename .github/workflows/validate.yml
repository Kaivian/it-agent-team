name: Package and runtime validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate manifests, skills, and paths
        run: python scripts/validate_package.py
      - name: Packaging and installer regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Runtime regression tests
        run: python -m unittest discover -s scripts/supervisor/tests -p "test_*.py" -v
      - name: Compile Python source
        run: python -m compileall -q scripts
